<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scotland, September 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#BCCDD1; --land:#EEF0E7; --coast:#8EA4A9; --loch:#A9C0C6;
  --route:#6A3768; --route-faint:#6A376833; --gold:#B8862A; --ink:#1E2A2E; --muted:#5B6B70;
  --panel:#F7F8F3; --opt:#2F6F7E; --rule:#D5DBD3; --sel:#E9E2EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --sea:#13232A; --land:#26363B; --coast:#40575E; --loch:#1B2D34;
  --route:#D2A0CF; --route-faint:#D2A0CF33; --gold:#E0B357; --ink:#E5ECEA; --muted:#9AAAAE;
  --panel:#1A2A30; --rule:#2F4248; --sel:#33293A; --opt:#7FC0CC; }}
:root[data-theme="dark"]{
  --sea:#13232A; --land:#26363B; --coast:#40575E; --loch:#1B2D34;
  --route:#D2A0CF; --route-faint:#D2A0CF33; --gold:#E0B357; --ink:#E5ECEA; --muted:#9AAAAE;
  --panel:#1A2A30; --rule:#2F4248; --sel:#33293A; --opt:#7FC0CC; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
.app{display:flex;flex-direction:column;min-height:100%}
.mapwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;height:48vh;min-height:280px;background:var(--sea);border-bottom:1px solid var(--rule);touch-action:none;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.6px;vector-effect:non-scaling-stroke}
.loch{fill:var(--loch);stroke:none}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt.faint{stroke:var(--route-faint);stroke-width:2px}
.rt.on{stroke:var(--route);stroke-width:3px}
.rt.ferry{stroke-dasharray:2 5}
.mk circle{stroke:var(--land);vector-effect:non-scaling-stroke;stroke-width:1.5px;cursor:pointer}
.mk .dot{fill:var(--route)}
.mk.off .dot{fill:var(--gold)}
.mk.opt .dot{fill:var(--opt)}
.mk rect{fill:var(--land);stroke:var(--route);stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}
.mk text{fill:var(--land);font-family:"Alegreya Sans",sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.active circle.dot{stroke:var(--ink);stroke-width:2.5px}
.town{font-family:"Alegreya",serif;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.town tspan.n{font-family:"Alegreya Sans",sans-serif;font-weight:400;fill:var(--muted)}
.tip{font-family:"Alegreya",serif;font-style:italic;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
header{padding:18px 20px 6px}
h1{font-family:"Alegreya",serif;font-weight:500;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.days{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;font:inherit;font-size:.92rem;padding:7px 12px;border-radius:18px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.days button[aria-pressed="true"]{background:var(--route);border-color:var(--route);color:var(--panel)}
button:focus-visible,li:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.day{padding:4px 20px 40px;max-width:640px}
.day h2{font-family:"Alegreya",serif;font-weight:500;font-size:1.5rem;margin:8px 0 2px}
.meta{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.intro{font-family:"Alegreya",serif;font-size:1.06rem;line-height:1.55;margin:0 0 16px}
ol.stops{list-style:none;margin:0;padding:0;counter-reset:s}
ol.stops li{display:grid;grid-template-columns:30px 1fr;gap:0 12px;padding:12px 8px;margin:0 -8px;border-top:1px solid var(--rule);border-radius:6px;cursor:pointer}
ol.stops li.active{background:var(--sel)}
.badge{width:26px;height:26px;border-radius:50%;background:var(--route);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;margin-top:2px}
li.off .badge{background:var(--gold)}
li.opt .badge{background:var(--opt)}
.flag.o{color:var(--opt);border-color:var(--opt)}
li.hotel .badge{background:transparent;border:1.5px solid var(--route);color:var(--route);border-radius:4px}
.nm{font-family:"Alegreya",serif;font-weight:700;font-size:1.1rem}
.when{color:var(--muted);font-size:.88rem}
.flag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:0 7px;margin-left:6px;vertical-align:2px}
.note{grid-column:2;font-family:"Alegreya",serif;margin:3px 0 0;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.85rem;padding:0 20px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;background:var(--route);display:inline-block}
.sw.g{background:var(--gold)}
.sw.o{background:var(--opt)}
.sw.h{background:transparent;border:1.5px solid var(--route);border-radius:2px}
.sw.f{width:18px;height:0;border-radius:0;border-top:2px dotted var(--route);background:none}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 16px;margin:0;padding:0;list-style:none}
.overview li{padding:8px 0;border-top:1px solid var(--rule);cursor:pointer}
.overview b{font-family:"Alegreya",serif;font-weight:700;display:block}
.overview small{color:var(--muted)}
@media (min-width:900px){
  html,body{height:100%}
  .app{flex-direction:row;height:100%}
  .mapwrap{position:relative;top:0;height:100%;flex:1 1 auto;border-bottom:0;border-right:1px solid var(--rule)}
  .side{width:420px;flex:0 0 420px;overflow-y:auto;height:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Map of the Scotland route"></svg>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
  </div>
  <div class="side">
    <header>
      <h1>Scotland by coach</h1>
      <p class="sub" id="sub"></p>
    </header>
    <nav class="days" id="days" aria-label="Choose a day"></nav>
    <div class="legend"><span><i class="sw"></i>Tour stop</span><span><i class="sw o"></i>Optional excursion</span><span><i class="sw g"></i>Off itinerary</span><span><i class="sw h"></i>Hotel</span><span><i class="sw f"></i>Ferry</span></div>
    <section class="day" id="day" aria-live="polite"></section>
  </div>
</div>

function clearMarkers(){gMk.innerHTML='';gTip.innerHTML='';markers=[]}
function select(i){
  sel=i;activeStop=-1;btns.forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i+1)));
  btns[i+1].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  T.days.forEach((d,j)=>d.paths.forEach(p=>p.setAttribute('class','rt '+(i===-1||j===i?'on':'faint')+(p.getAttribute('class').includes('ferry')?' ferry':''))));
  clearMarkers();gTown.style.display=i===-1?'':'none';
  const box=document.getElementById('day');
  if(i===-1){
    T.days.forEach((d,j)=>d.stops.forEach(s=>{const [x,y]=P(s.lon,s.lat);const g=el('g',{class:'mk'+(s.kind?' '+s.kind:'')},gMk);
      const m={x,y,small:true,g};if(s.kind==='hotel'){m.r=el('rect',{},g)}else{m.c=el('circle',{cx:x,cy:y,class:'dot'},g)}
      g.addEventListener('click',()=>select(j));markers.push(m)}));
    box.innerHTML=`<h2>Fourteen days through the Lowlands, the Highlands, and three islands</h2><p class="meta">Pick a day to fly the map there.</p><ul class="overview">${T.days.map((d,j)=>`<li tabindex="0" data-j="${j}"><b>${d.title}</b><small>${d.label}, ${d.miles} mi</small></li>`).join('')}</ul>`;
    box.querySelectorAll('li').forEach(li=>{li.onclick=()=>select(+li.dataset.j);li.onkeydown=e=>{if(e.key==='Enter')select(+li.dataset.j)}});
    fitTo(bboxOf(T.days.flatMap(routePts)));
  }else{
    const d=T.days[i];let n=0;
    const nums=d.stops.map(s=>s.kind==='hotel'?'':String(++n));
    d.stops.forEach((s,k)=>{const [x,y]=P(s.lon,s.lat);const g=el('g',{class:'mk'+(s.kind?' '+s.kind:'')},gMk);
      const m={x,y,g,k};if(s.kind==='hotel'){m.r=el('rect',{},g)}else{m.c=el('circle',{cx:x,cy:y,class:'dot'},g);m.t=el('text',{x,y},g);m.t.textContent=nums[k]}
      g.addEventListener('click',e=>{e.stopPropagation();focusStop(k,false)});markers.push(m)});
    box.innerHTML=`<h2>${d.title}</h2><p class="meta">${d.label}, about ${d.miles} miles</p><p class="intro">${d.intro}</p><ol class="stops">${d.stops.map((s,k)=>`<li tabindex="0" data-k="${k}" class="${s.kind||''}"><span class="badge">${s.kind==='hotel'?'':nums[k]}</span><div><span class="nm">${s.n}</span>${s.kind==='off'?'<span class="flag">Off itinerary</span>':s.kind==='opt'?'<span class="flag o">Optional excursion</span>':''}<div class="when">${fmtWhen(s)}</div></div><p class="note">${s.note}</p></li>`).join('')}</ol>`;
    box.querySelectorAll('li').forEach(li=>{li.onclick=()=>focusStop(+li.dataset.k,true);li.onkeydown=e=>{if(e.key==='Enter')focusStop(+li.dataset.k,true)}});
    fitTo(bboxOf(routePts(d).concat(d.stops.map(s=>P(s.lon,s.lat)))));
  }
  rescale();
}
function focusStop(k,zoom){
  const d=T.days[sel],s=d.stops[k];activeStop=k;
  markers.forEach(m=>m.g.classList.toggle('active',m.k===k));
  const m=markers.find(m=>m.k===k);if(m)gMk.appendChild(m.g);
  gTip.innerHTML='';const [x,y]=P(s.lon,s.lat);const t=el('text',{x,y,class:'tip','text-anchor':'middle'},gTip);t.textContent=s.n;
  document.querySelectorAll('ol.stops li').forEach(li=>li.classList.toggle('active',+li.dataset.k===k));
  const li=document.querySelector(`ol.stops li[data-k="${k}"]`);
  if(!zoom&&li)li.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(zoom){const span=Math.min(vb[2],vb[3],60)/2;fitTo([x-span,y-span,x+span,y+span])}
  rescale();
}
// pan and zoom
const ptrs=new Map();let last=null,pinch0=null;
function toUnits(cx,cy){const r=svg.getBoundingClientRect(),k=pxPerUnit();const ox=(r.width-vb[2]*k)/2,oy=(r.height-vb[3]*k)/2;return [vb[0]+(cx-r.left-ox)/k,vb[1]+(cy-r.top-oy)/k]}
function zoomAt(f,cx,cy){const [ux,uy]=toUnits(cx,cy);const nw=Math.min(Math.max(vb[2]*f,8),W*2.2),ff=nw/vb[2];vb=[ux-(ux-vb[0])*ff,uy-(uy-vb[1])*ff,vb[2]*ff,vb[3]*ff];apply()}
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);svg.classList.add('drag');last=[e.clientX,e.clientY];
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
window.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const dd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0){zoomAt(pinch0/dd,(a[0]+b[0])/2,(a[1]+b[1])/2)}pinch0=dd;return}
  const k=pxPerUnit();vb[0]-=(e.clientX-last[0])/k;vb[1]-=(e.clientY-last[1])/k;last=[e.clientX,e.clientY];apply()});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(!ptrs.size)svg.classList.remove('drag');const v=[...ptrs.values()][0];if(v)last=v};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
const ctr=()=>{const r=svg.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
document.getElementById('zin').onclick=()=>zoomAt(.6,...ctr());
document.getElementById('zout').onclick=()=>zoomAt(1/.6,...ctr());
window.addEventListener('resize',()=>{apply()});
select(-1);
</script>
</body>
</html>
